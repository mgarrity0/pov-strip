; pov-strip: PlatformIO build. Arduino core 3.x comes from pioarduino.
;   pio run -t upload && pio device monitor     (default env: esp32dev)
;   pio run -e xiao_esp32s3 -t upload            (other boards)
; Arduino IDE instead: open pov_strip/pov_strip.ino (arduino-esp32 3.x).

[platformio]
src_dir = pov_strip
default_envs = esp32dev

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200

[env:xiao_esp32s3]
board = seeed_xiao_esp32s3

[env:esp32dev]
board = esp32dev
; 3 MB app, no OTA: room for images (default layout is 1.25 MB)
board_build.partitions = huge_app.csv

[env:esp32s3_devkitc]
board = esp32-s3-devkitc-1
board_build.partitions = huge_app.csv
